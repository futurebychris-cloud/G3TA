services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: g3ta-whisper
    environment:
      ASR_ENGINE: faster_whisper
      # "base" keeps voice answers responsive on CPU (~2s vs ~6s for "small"
      # per clip in the Colima VM) while still auto-detecting major languages.
      # Raise back to "small"/"medium" if running with real GPU/CPU headroom.
      ASR_MODEL: base
    ports:
      - "9000:9000"
    volumes:
      - g3ta-whisper-cache:/root/.cache
    restart: unless-stopped

volumes:
  g3ta-whisper-cache:
