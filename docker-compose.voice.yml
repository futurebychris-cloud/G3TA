services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: g3ta-whisper
    environment:
      ASR_ENGINE: faster_whisper
      # "small" for accuracy (multilingual detection noticeably better than
      # "base"); kept responsive by running Colima with 6 CPUs. Drop to "base"
      # only if the VM is CPU-constrained again.
      ASR_MODEL: small
    ports:
      - "9000:9000"
    volumes:
      - g3ta-whisper-cache:/root/.cache
    restart: unless-stopped

volumes:
  g3ta-whisper-cache:
