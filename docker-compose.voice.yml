services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: g3ta-whisper
    environment:
      ASR_ENGINE: faster_whisper
      # "small" gives much more reliable non-English transcription/translation than
      # "tiny" (needed for the "speak another language" auto-detect+translate mode);
      # raise to "medium" for even better accuracy if the extra CPU/RAM is available.
      ASR_MODEL: small
    ports:
      - "9000:9000"
    volumes:
      - g3ta-whisper-cache:/root/.cache
    restart: unless-stopped

volumes:
  g3ta-whisper-cache:
