services:
  web:
    build:
      context: .
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    env_file:
      - .env
    environment:
      PIPER_TTS_URL: http://piper:8080/synthesize
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      BOOKING_AUTOMATION_ENABLED: "1"
      BOOKING_API_TOKEN: "f738af94c4e920dd52809f9764b9edd518a75d20ed2977bc"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      piper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  piper:
    build:
      context: ./piper
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
